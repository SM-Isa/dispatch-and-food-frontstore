# .github/workflows/terraform.yml
name: Terraform

on:
  push:
    branches: [main]
    paths: ['infra/**']
  pull_request:
    paths: ['infra/**']

jobs:
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'terraform-runner@dispatch-prod.iam.gserviceaccount.com'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.x'

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: Terraform init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform plan -no-color -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = 'infra/environments/${{ matrix.environment }}/tfplan';
            let planText = 'Plan generated successfully.';
            if (fs.existsSync(planFile)) {
              try {
                planText = fs.readFileSync(planFile, 'utf8');
              } catch (e) {
                planText = 'Binary tfplan generated.';
              }
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — ${{ matrix.environment }}\n\`\`\`\n${planText.slice(0, 60000)}\n\`\`\``
            });

  apply-staging:
    name: Apply Staging
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'terraform-runner@dispatch-stg.iam.gserviceaccount.com'
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.7.x' }
      - working-directory: infra/environments/staging
        run: |
          terraform init
          terraform apply -auto-approve

  apply-production:
    name: Apply Production
    needs: apply-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # requires manual approval in GitHub Environments
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'terraform-runner@dispatch-prod.iam.gserviceaccount.com'
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.7.x' }
      - working-directory: infra/environments/production
        run: |
          terraform init
          terraform apply -auto-approve
