name: Weekly Staging Load Test

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly, Sundays at 03:00 UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Load test scenario to execute (all, orders, dispatch, rider-telemetry)'
        required: false
        default: 'all'

jobs:
  load-test:
    name: Execute Staging Performance Run
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_LOADTEST_SERVICE_ACCOUNT }}

      - name: Setup k6 Binary
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Seed Staging Environment
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx ts-node scripts/load-test-seed.ts > seed-output.txt
          cat seed-output.txt

      - name: Execute k6 Load Test Suite
        env:
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          API_TOKEN: ${{ secrets.STAGING_LOADTEST_TOKEN }}
        run: |
          mkdir -p load-test-results
          SCENARIO="${{ github.event.inputs.scenario || 'all' }}"
          if [ "$SCENARIO" = "all" ]; then
            ./load-tests/run-all.sh staging
          else
            k6 run --summary-export="load-test-results/${SCENARIO}-summary.json" "load-tests/${SCENARIO}.js"
          fi

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: load-test-results/

      - name: Cleanup Staging Data
        if: always()
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx ts-node scripts/load-test-cleanup.ts
